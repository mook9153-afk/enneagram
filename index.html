<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>나를 찾는 에니어그램 여행</title>
<style>
:root{
  --bg1:#fdf6ec; --bg2:#eaf4fb; --ink:#2f3542; --sub:#69707d; --line:#e3e6ee;
  --card:#ffffff; --main:#5b8def; --main-d:#3f6fd1; --soft:#f1f5ff; --ok:#33b28a; --warn:#f08a5d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;
  line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;margin:.2em 0;line-height:1.3}
h2{font-size:1.25rem;margin:1.2em 0 .5em}
h3{font-size:1.05rem;margin:1em 0 .3em}
p{margin:.5em 0}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 6px 24px rgba(60,80,120,.10);margin:14px 0}
.center{text-align:center}
.sub{color:var(--sub);font-size:.95rem}
.big-emoji{font-size:4.2rem;line-height:1.1}
.btn{display:inline-block;border:0;border-radius:16px;padding:14px 22px;font-size:1.05rem;font-weight:700;
  font-family:inherit;cursor:pointer;background:var(--main);color:#fff;transition:transform .08s,background .15s}
.btn:hover{background:var(--main-d)} .btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--main-d);border:2px solid #cfdcf8}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:9px 14px;font-size:.92rem;border-radius:12px}
.btn.wide{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{background:#fff;color:#d2504b;border:2px solid #f3cfcd}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:1.1rem;padding:13px 15px;
  border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
select{font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #b9cdfa;outline-offset:2px}
.steps{display:flex;gap:8px;margin:8px 0 0}
.steps span{flex:1;text-align:center;font-size:.82rem;padding:7px 4px;border-radius:999px;background:#fff;color:var(--sub);border:2px solid var(--line)}
.steps span.on{background:var(--main);color:#fff;border-color:var(--main);font-weight:700}
.steps span.done{background:#e3f6ef;color:#1f8a68;border-color:#bfe8d9}
.bar{height:12px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7fb0ff,#5b8def);border-radius:99px;transition:width .25s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:1.08rem;
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:#b9cdfa;background:var(--soft)}
.opt.sel{border-color:var(--main);background:#e8f0ff;font-weight:700}
.opt .n{flex:none;width:34px;height:34px;border-radius:50%;background:#eef2fb;display:grid;place-items:center;font-weight:700;color:var(--main-d)}
.opt.sel .n{background:var(--main);color:#fff}
.qstem{font-size:1.35rem;font-weight:800;margin:6px 0 14px;line-height:1.4}
.tone{font-size:.9rem;font-weight:700;color:#7a5a2b;background:#fff3d9;display:inline-block;padding:4px 12px;border-radius:99px;margin:14px 0 2px}
.note{background:#fff8e6;border:2px dashed #f2d48a;border-radius:16px;padding:14px 16px;margin:12px 0}
.calm{background:#e9f8f1;border:2px solid #bfe8d9;border-radius:16px;padding:14px 16px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:#fff;
  font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.sel{color:#fff;border-color:transparent}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef2fb;color:var(--main-d)}
.hero{border-radius:22px;padding:26px 20px;color:#fff;text-align:center}
.hero h1{color:#fff;margin:.1em 0}
.hero .sub{color:rgba(255,255,255,.92)}
ul.clean{padding-left:1.15em;margin:.3em 0}
ul.clean li{margin:.25em 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}h1{font-size:1.45rem}.qstem{font-size:1.2rem}}
.tcard{border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,80,120,.12)}
.tcard .e{font-size:2.2rem}
.tcard b{display:block}
.box{border-radius:16px;padding:14px 16px;margin:10px 0;background:#f7f9fd}
.box.good{background:#eaf7f1}.box.grow{background:#fff4e8}.box.friend{background:#eef2ff}.box.heart{background:#fdeef3}
.hbar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}
.hbar .track{height:14px;background:#e9edf5;border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px}
@media(max-width:560px){.hbar{grid-template-columns:110px 1fr 30px;font-size:.85rem}}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.foot{margin-top:26px;text-align:center;font-size:.85rem;color:var(--sub)}
.linkbtn{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f3542;color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:9;max-width:90vw}
@media print{
  body{background:#fff}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  #app{max-width:none;padding:0}
}
</style>
</head>

function calc(rec){
  const L = {A:0,B:0,C:0,D:0,E:0,F:0};
  for(let i=0;i<60;i++){
    const a = +rec.ans[i]; if(!a) continue;
    const col = KEY[i].indexOf(String(a));
    L[(i<30?"ABC":"DEF")[col]]++;
  }
  const q = {}, bonus = {}, total = {};
  for(let t=1;t<=9;t++){ q[t] = L[FORMULA[t][0]] + L[FORMULA[t][1]]; bonus[t]=0; }
  const f = FEEL.find(x=>x.k===rec.feel.k);
  const feelType = f ? f.t : 0;
  if(f) bonus[f.t] += rec.feel.s===3 ? 6 : rec.feel.s===2 ? 3 : 0;
  REACT[rec.feel.r||0].types.forEach(t=>bonus[t]+=2);
  rec.deep.forEach(t=>{ if(t) bonus[t]+=2; });
  for(let t=1;t<=9;t++) total[t] = q[t]+bonus[t];
  const by = (obj,tie)=>Object.keys(obj).map(Number).sort((a,b)=>obj[b]-obj[a] || (tie?tie[b]-tie[a]:0) || a-b);
  const rank = by(total,q), qRank = by(q,total);
  const deepCount = {}; rec.deep.forEach(t=>{ if(t) deepCount[t]=(deepCount[t]||0)+1; });
  const deepTop = Object.keys(deepCount).map(Number).sort((a,b)=>deepCount[b]-deepCount[a]||a-b);
  return {L,q,bonus,total,rank,qRank,feelType,deepTop,deepCount,top:rank[0]};
}
function wingOf(t,q){
  const a = t===1?9:t-1, b = t===9?1:t+1;
  if(q[a]===q[b]) return null;
  return q[a]>q[b]?a:b;
}

function toCode(rec){
  const digits = rec.ans.join("") + (FEEL.findIndex(f=>f.k===rec.feel.k)+1) + (rec.feel.s||1) + (rec.feel.r||0) + rec.deep.join("") + (rec.chosen||0);
  return "E" + BigInt("1"+digits).toString(36) + "." + b64e([rec.name,rec.cls||"",rec.aud||"kid",rec.mode||"class",rec.date||"",rec.pledge||""].join("\n"));
}
function fromCode(code){
  const m = /^E([0-9a-z]+)\.([\w-]+)$/.exec(code.trim()); if(!m) return null;
  let n = 0n; for(const ch of m[1]) n = n*36n + BigInt(parseInt(ch,36));
  const d = n.toString().slice(1); if(d.length!==68) return null;
  const [name,cls="",aud="kid",mode="class",date="",pledge=""] = b64d(m[2]).split("\n");
  return {id:"c"+m[1].slice(0,14)+m[2].slice(0,6), name, mode:mode==="private"?"private":"class", cls, aud:aud==="adult"?"adult":"kid", pledge:pledge.slice(0,80), date:/^\d{4}-\d\d-\d\d$/.test(date)?date:new Date().toISOString().slice(0,10),
    ans:d.slice(0,60).split("").map(Number), feel:{k:(FEEL[+d[60]-1]||{}).k||null, s:+d[61], r:+d[62]},
    deep:d.slice(63,67).split("").map(Number), chosen:+d[67]||0, imported:true};
}

function radarSVG(q, hi){
  const cx=170, cy=165, R=110, n=9, max=Math.max(40, ...Object.values(q));
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let s=`<svg viewBox="0 0 340 330" role="img" aria-label="유형별 검사지 점수 그래프" style="width:100%;max-width:420px;display:block;margin:0 auto">`;
  [.25,.5,.75,1].forEach(k=>{ s+=`<polygon points="${ORDER.map((_,i)=>pt(i,R*k).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#dfe4ee" stroke-width="1"/>`; });
  ORDER.forEach((t,i)=>{ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e6eaf2"/>`; });
  s+=`<polygon points="${ORDER.map((t,i)=>pt(i,R*q[t]/max).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${TYPES[hi].color}33" stroke="${TYPES[hi].color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  ORDER.forEach((t,i)=>{
    const [x,y]=pt(i,R*q[t]/max), [lx,ly]=pt(i,R+26);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${t===hi?5:3.5}" fill="${TYPES[t].color}"/>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="${t===hi?800:600}" fill="#2f3542">${t}번</text>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="middle" font-size="12" fill="#69707d">${q[t]}점</text>`;
  });
  return s+"</svg>";
}

/* ---------- QR 코드 (바이트 모드 · 오류 정정 L · 버전 1~6, 외부 도구 없이 직접 그림) ---------- */
function qrMatrix(text){
  const bytes=[...unescape(encodeURIComponent(text))].map(c=>c.charCodeAt(0));
  const CAP=[0,19,34,55,80,108,136], ECC=[0,7,10,15,20,26,18], BLK=[0,1,1,1,1,1,2];
  let v=1; while(v<=6 && bytes.length>CAP[v]-2) v++;
  if(v>6) return null;
  const size=17+4*v, m=[], fn=[];
  for(let y=0;y<size;y++){ m.push(Array(size).fill(false)); fn.push(Array(size).fill(false)); }
  const set=(x,y,dark)=>{ if(x>=0&&x<size&&y>=0&&y<size){ m[y][x]=dark; fn[y][x]=true; } };
  // 타이밍 무늬, 위치 찾기 무늬, 정렬 무늬
  for(let i=0;i<size;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)); set(cx+dx,cy+dy,d!==2&&d!==4); } });
  if(v>=2){ const c=size-7; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) set(c+dx,c+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }
  const format=mask=>{
    const data=(1<<3)|mask; let rem=data;                       // 오류 정정 L = 01
    for(let i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)*0x537);
    const bits=((data<<10)|rem)^0x5412, b=i=>((bits>>>i)&1)!==0;
    for(let i=0;i<=5;i++) set(8,i,b(i));
    set(8,7,b(6)); set(8,8,b(7)); set(7,8,b(8));
    for(let i=9;i<15;i++) set(14-i,8,b(i));
    for(let i=0;i<8;i++) set(size-1-i,8,b(i));
    for(let i=8;i<15;i++) set(8,size-15+i,b(i));
    set(8,size-8,true);
  };
  format(0);
  // 자료 코드워드
  const cap=CAP[v], bits=[]; const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
  put(4,4); put(bytes.length,8); bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,cap*8-bits.length)); while(bits.length%8) bits.push(0);
  const data=[]; for(let i=0;i<bits.length;i+=8) data.push(parseInt(bits.slice(i,i+8).join(""),2));
  for(let pad=0xEC; data.length<cap; pad^=0xEC^0x11) data.push(pad);
  // 오류 정정 코드워드 (리드-솔로몬)
  const mul=(x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; };
  const deg=ECC[v], div=Array(deg).fill(0); div[deg-1]=1;
  for(let i=0,root=1;i<deg;i++){ for(let j=0;j<deg;j++){ div[j]=mul(div[j],root); if(j+1<deg) div[j]^=div[j+1]; } root=mul(root,2); }
  const nb=BLK[v], bl=cap/nb, blocks=[];
  for(let b=0;b<nb;b++){
    const d=data.slice(b*bl,(b+1)*bl), r=Array(deg).fill(0);
    d.forEach(x=>{ const f=x^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=mul(c,f); }); });
    blocks.push({d,e:r});
  }
  const all=[];
  for(let i=0;i<bl;i++) blocks.forEach(b=>all.push(b.d[i]));
  for(let i=0;i<deg;i++) blocks.forEach(b=>all.push(b.e[i]));
  // 지그재그로 채우기
  let k=0;
  for(let right=size-1;right>=1;right-=2){
    if(right===6) right=5;
    for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){
      const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
      if(!fn[y][x] && k<all.length*8){ m[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)!==0; k++; }
    }
  }
  // 마스크 고르기
  const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const flip=n=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!fn[y][x] && MASK[n](x,y)) m[y][x]=!m[y][x]; };
  const penalty=()=>{
    let p=0, dark=0;
    for(let a=0;a<size;a++) for(const horiz of [true,false]){ let run=0, prev=null;
      for(let b=0;b<size;b++){ const c=horiz?m[a][b]:m[b][a]; if(c===prev) run++; else { if(run>=5) p+=run-2; run=1; prev=c; } }
      if(run>=5) p+=run-2; }
    for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=m[y][x]; if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1]) p+=3; }
    m.forEach(r=>r.forEach(c=>{ if(c) dark++; }));
    return p+Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
  };
  let best=0, bestP=Infinity;
  for(let n=0;n<8;n++){ flip(n); format(n); const p=penalty(); if(p<bestP){ bestP=p; best=n; } flip(n); }
  flip(best); format(best);
  return m;
}
function qrPath(m,quiet){ let d=""; m.forEach((row,y)=>row.forEach((c,x)=>{ if(c) d+=`M${x+quiet} ${y+quiet}h1v1h-1z`; })); return d; }
function qrSVG(text,px){
  const m=qrMatrix(text); if(!m) return "";
  const n=m.length+8;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="${n}" height="${n}" fill="#fff"/><path d="${qrPath(m,4)}" fill="#000"/></svg>`;
}

   5. 동작
   ========================================================= */
const A = {
  home(){ S.from=null; go("home"); },
  async start(){
    if(!S.mode){ toast("어떻게 검사할지 먼저 골라 주세요"); return; }
    const isC=S.mode==="class";
    const nm=document.getElementById("nm").value.trim().replace(isC?/\s+/g:/^$/,"");
    const pin=isC?(document.getElementById("pn").value||"").trim():"";
    const keep={name:nm,mode:S.mode,cls:"",aud:S.mode==="private"?S.aud:"kid",pin};
    if(S.mode==="class" && ONLINE){
      const code=(document.getElementById("cc").value||"").trim().toUpperCase();
      if(!isCode(code)){ toast("반 코드 6자리를 적어 주세요"); document.getElementById("cc").focus(); return; }
      if(!classInputOk(nm,pin)) return;
      toast("반을 확인하고 있어요…");
      try{
        const info=await api("classInfo",{code});
        const l=clsLabels(); l[info.code]={n:info.name,t:info.teacher}; store.set("ennea_clslabels",l);
        keep.cls=info.code;
        if(!S.retake){
          const prev=cleanRecord((await api("myResult",{code:info.code,name:nm,pin})).record);
          if(prev){ S.found=prev; S.name=nm; S.ccode=info.code; render(); toast("이전에 검사한 결과가 있어요"); return; }
        }
        toast((info.teacher?info.teacher+" 선생님의 ":"")+info.name+"에서 검사해요");
      }catch(e){ toast(e.message); return; }
    } else {
      if(!nm){ toast("이름을 먼저 적어 주세요"); document.getElementById("nm").focus(); return; }
      if(S.mode==="class"){
        if(!classInputOk(nm,pin)) return;
        keep.cls=/^\d+-\d+$/.test(S.cls)?S.cls:"5-1"; store.set("ennea_lastcls",keep.cls);
        const prev=!S.retake && classRecords().filter(x=>(x.cls||"")===keep.cls && x.name===nm && !x.imported).pop();
        if(prev && prev.pin && prev.pin!==pin){ toast("이 이름으로 한 검사가 있는데 비밀번호가 달라요"); return; }
        if(prev){ S.found=prev; S.name=nm; render(); toast("이전에 검사한 결과가 있어요"); return; }
      }
    }
    if(S.retake && S.found) keep.reuseId=S.found.id;
    Object.assign(S,fresh(),keep); go("feel");
  },
  mode(v){ S.mode=v; S.found=null; S.retake=false; if(v==="class"){ S.aud="kid"; if(!S.cls) S.cls=store.get("ennea_lastcls","5-1"); } render(); const el=document.getElementById(v==="class"&&ONLINE&&!S.ccode?"cc":"nm"); if(el) el.focus(); },
  delmine(v){ if(confirm("이 결과를 이 기기에서 지울까요? 되돌릴 수 없어요.")){ store.set("ennea_records",records().filter(x=>x.id!==v)); if(S.rec&&S.rec.id===v) S.rec=null; go("home"); toast("결과를 지웠어요"); } },
  classview(v){
    if(S.view!=="classview") S.cvFrom = S.view==="teacher"?"teacher":S.view==="result"?"result":"home";
    S.vcls=v||""; S.openType=0; S.cvOnline=ONLINE&&isCode(S.vcls); S.cvMsg="";
    if(S.cvOnline){
      if(S.tok && S.tcls===S.vcls) S.cvList=S.tlist.map(r=>({name:r.name,t:r.chosen||calc(r).top}));
      else {
        S.cvList=null; S.cvMsg="불러오는 중이에요…";
        api("classmates",{code:S.vcls}).then(
          j=>{ S.cvList=j.list.map(x=>({name:x.name,t:x.type})); S.cvMsg=j.share?"":"선생님이 아직 '반 친구들끼리 유형 보기'를 열지 않았어요."; },
          e=>{ S.cvMsg=e.message; }
        ).then(()=>{ if(S.view==="classview") render(); });
      }
    }
    go("classview");
  },
  cvopen(v){ S.openType=+v; render(); const d=document.getElementById("detail"); if(d) d.scrollIntoView({behavior:"smooth"}); },
  tcls(v){ S.tcls=v; render(); },
  viewprev(){
    const r=S.found; if(!r) return;
    if(isOnlineCls(r)){ r.synced=true; r.pin=S.pin||""; }
    saveRecord(r); sset("ennea_last",r.id); S.found=null; S.rec=r; S.show=0; S.from=null; go("result");
  },
  retake(){ if(!S.found) return; S.retake=true; return A.start(); },
  resume(){ const p=store.get("ennea_progress",null); if(!p) return; Object.assign(S,fresh(),p); render(); window.scrollTo(0,0); },
  goto(v){ go(v); },
  feel(v){ S.feel.k=v; saveProgress(); render(); },
  feelnext(){ go("feel2"); },
  feels(v){ S.feel.s=+v; saveProgress(); render(); },
  feelr(v){ S.feel.r=+v; saveProgress(); render(); },
  ans(v){
    const i=S.qi; S.ans[i]=+v; saveProgress(); render();
    setTimeout(()=>{ if(S.view==="quiz" && S.qi===i) A.qnext(); },260);
  },
  qnext(){ if(!S.ans[S.qi]) return; if(S.qi<59){ S.qi++; saveProgress(); render(); } else { const miss=S.ans.indexOf(0); if(miss>=0){ S.qi=miss; render(); toast("아직 고르지 않은 문항이 있어요"); } else go("deep"); } },
  qprev(){ if(S.qi>0){ S.qi--; render(); } else go("calm"); },
  deep(v){ const i=S.di; S.deep[i]=+v; saveProgress(); render(); setTimeout(()=>{ if(S.view==="deep" && S.di===i && i<3) A.dnext(); },260); },
  dnext(){ if(!S.deep[S.di]) return; if(S.di<3){ S.di++; saveProgress(); render(); window.scrollTo(0,0); } else finish(); },
  dprev(){ if(S.di>0){ S.di--; render(); } else { S.qi=59; go("quiz"); } },
  show(v){ S.show=+v; render(); const d=document.getElementById("tdetail"); if(d) d.scrollIntoView({behavior:"smooth"}); },
  choose(v){ S.rec.chosen=+v; S.show=+v; saveRecord(S.rec); pushSoon(S.rec); render(); window.scrollTo(0,0); toast("나의 유형으로 골랐어요. 언제든 다시 고를 수 있어요"); },
  types(){ S.openType=0; go("types"); },
  opentype(v){ S.openType=+v; render(); const d=document.getElementById("detail"); if(d) d.scrollIntoView({behavior:"smooth"}); },
  friend(){ go("friend"); },
  pickfriend(v){ S.friend=+v; render(); },
  openrec(v){ const r=records().find(x=>x.id===v); if(r){ S.rec=r; S.show=0; S.from=null; go("result"); } },
  restart(){ sset("ennea_last",null); Object.assign(S,fresh()); go("home"); },
  print(){ window.print(); },
  png(){ savePNG(S.rec); },
  code(){
    const code=toCode(S.rec);
    const done=()=>toast("결과 코드를 복사했어요. 선생님께 붙여 넣어 보내세요");
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done,()=>prompt("아래 코드를 복사하세요",code));
    else prompt("아래 코드를 복사하세요",code);
  },
  teacher(){
    if(ONLINE && !S.tok){
      let s=null; try{ s=JSON.parse(sget("ennea_tok")||"null"); }catch(e){}
      if(s && s.tok){ S.tok=s.tok; S.tname=s.name; S.teacher=true; S.tcls=""; S.tlist=[]; go("teacher"); return tcall("listClasses",{},j=>{ S.tclasses=j.classes; S.tadmin=!!j.admin; }); }
    }
    go("teacher");
  },
  pw(){ if(document.getElementById("pw").value===TEACHER_PW){ S.teacher=true; render(); } else toast("비밀번호가 달라요"); },

/* 백업 파일 불러오기 */
function cleanRecord(r){
  if(!r || typeof r.name!=="string" || !Array.isArray(r.ans) || r.ans.length!==60 || !Array.isArray(r.deep) || r.deep.length!==4) return null;
  const ans=r.ans.map(Number), deep=r.deep.map(Number);
  if(!ans.every(a=>a>=1&&a<=3) || !deep.every(d=>d>=1&&d<=9)) return null;
  const f=r.feel||{}, k=FEEL.some(x=>x.k===f.k)?f.k:null, s=[1,2,3].includes(+f.s)?+f.s:1, re=[0,1,2,3].includes(+f.r)?+f.r:0;
  const ch=+r.chosen>=1&&+r.chosen<=9?+r.chosen:0;
  return {id:String(r.id||"b"+ans.join("").slice(0,20)+r.name), name:r.name.slice(0,20), date:String(r.date||"").slice(0,10),
    mode:"class", cls:String(r.cls||"").replace(/[^\w가-힣-]/g,"").slice(0,12), aud:"kid", ans, feel:{k,s,r:re}, deep, chosen:ch, pledge:String(r.pledge||"").slice(0,80), imported:!!r.imported};
}
async function restoreFiles(files){
  let added=0, updated=0, bad=0;
  for(const file of files){
    try{
      const data=JSON.parse(await file.text());
      const arr=Array.isArray(data)?data:data.records;
      if(!Array.isArray(arr)) throw 0;
      const have=new Set(records().map(r=>r.id));
      arr.forEach(x=>{ const r=cleanRecord(x); if(!r){ bad++; return; } have.has(r.id)?updated++:added++; have.add(r.id); saveRecord(r); });
    }catch(e){ bad++; }
  }
  render();
  toast(added||updated ? `${added}명 추가${updated?`, ${updated}명은 이미 있어서 덮어썼어요`:""}${bad?` (읽지 못한 것 ${bad}개)`:""}` : "백업 파일을 읽지 못했어요");
}

  ].map(s=>{ const L=s.items.map(it=>split(it,FS,400,W-2*P-2*IN)); return {...s,L,h:28+(s.title?48:0)+L.reduce((n,l)=>n+l.length*LH+8,0)+14}; });
  const foot=split(ka("이 결과는 정답이 아니라 출발점이에요. 호기심을 가지고 평소의 나를 살펴보며 나를 알아가는 여행을 계속해요.",

  g.beginPath(); ORDER.forEach((tt,i)=>{ const p=pt(i,R*c.q[tt]/max); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }); g.closePath();
  g.fillStyle=T.color+"44"; g.fill(); g.strokeStyle=T.color; g.lineWidth=4; g.stroke();
  ORDER.forEach((tt,i)=>{ const p=pt(i,R+42); g.fillStyle="#2f3542"; font(24,tt===t?800:600); g.fillText(`${tt}번`,p[0],p[1]); g.fillStyle="#69707d"; font(20); g.fillText(`${c.q[tt]}점`,p[0],p[1]+24); });
  y+=RADAR+20;
  // 설명 칸들
  g.textAlign="left";
  secs.forEach(s=>{
    g.fillStyle=s.bg; rr(g,P,y,W-2*P,s.h,26); g.fill();
    let ty=y+28+26;
    if(s.title){ g.fillStyle="#2f3542"; font(29,800); g.fillText(s.title,P+IN,ty); ty+=48; }
    g.fillStyle="#2f3542"; font(FS,400);
    s.L.forEach(l=>{ l.forEach((line,i)=>{ g.fillText(i&&/^[•✏]/.test(l[0])?"   "+line:line,P+IN,ty); ty+=LH; }); ty+=8; });
    y+=s.h+16;
  });
  // 맺음말
  g.textAlign="center"; g.fillStyle=T.color; font(23,600);
  y+=22; foot.forEach(line=>{ g.fillText(line,W/2,y); y+=32; });
  g.fillStyle="#9aa1ad"; font(20); g.fillText(`나를 찾는 에니어그램 여행 · ${r.date}`,W/2,H-24);
  cv.toBlob(b=>download(b,`에니어그램_${r.name}.png`),"image/png");
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(g,text,x,y,maxW,lh){
  let line=""; for(const w of text.split(" ")){ const t=line?line+" "+w:w; if(g.measureText(t).width>maxW && line){ g.fillText(line,x,y); y+=lh; line=w; } else line=t; }
  g.fillText(line,x,y); return y+lh;
}

/* '내 결과 다시 보기 주소'(#r=...)로 들어온 경우: 결과를 이 기기에 담고 바로 보여 준다 */
(function(){
  let m=null; try{ m=/^#r=(.+)$/.exec(location.hash||""); }catch(e){}
  if(!m) return;
  let r=null; try{ r=fromCode(decodeURIComponent(m[1])); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(!r) return;
  r.mode="private"; r.cls=""; r.link=true; r.imported=false;
  saveRecord(r); S.rec=r; S.show=0; S.from=null; S.view="result";
})();
render();
</script>
